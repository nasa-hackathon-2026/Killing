name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/snapshot/**"
      - "data/analysis/**"
      - "data/grid/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run format:check --prefix web
      - run: npm run lint --prefix web
      - run: npm run typecheck --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
      # Stable copy of the site under /stable/: the web front end as pinned by
      # the release tag below, built with a different base path. The root of
      # the site stays the latest main.
      - uses: actions/checkout@v4
        with:
          ref: submission-2026-11-15
          path: stable-src
      - run: npm ci --prefix stable-src/web
      - run: npx vite build --base=/earth-system-trend-detective/stable/
        working-directory: stable-src/web
      - run: mv stable-src/web/dist web/dist/stable
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
