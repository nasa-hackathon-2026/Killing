<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>資料層 tracer bullet</title>
<style>
  :root { --bg: #fff; --fg: #1a1a1a; --muted: #666; --line: #1f6feb; --grid: #ddd; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --fg: #eee; --muted: #999; --line: #6cb0ff; --grid: #333; }
  }
  body { background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; margin: 16px; }
  svg { width: 100%; max-width: 960px; height: auto; display: block; }
  .muted { color: var(--muted); font-size: 14px; }
  #error { color: #d33; }
</style>
</head>
<body>
<!-- 最小驗證頁（#6）：只證明「讀目錄檔 → 讀序列檔 → 畫線」走得通，之後由前端票取代。 -->
<h1 id="title">載入中…</h1>
<p id="asof" class="muted"></p>
<svg id="chart" viewBox="0 0 960 360" role="img" aria-labelledby="title"></svg>
<p id="source" class="muted"></p>
<p id="error"></p>
<script>
const DATA = "../data/snapshot/";
const el = (id) => document.getElementById(id);
const svg = (tag, attrs) => {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
};

async function main() {
  const catalog = await (await fetch(DATA + "catalog.json")).json();
  const entry = catalog.series[0];
  const variable = catalog.variables.find((v) => v.id === entry.variable_id);
  const location = catalog.locations.find((l) => l.id === entry.location_id);
  const series = await (await fetch(DATA + entry.file)).json();

  el("title").textContent = `${location.name_zh} ${variable.name_zh}（${series.unit}）`;
  const latestMonth = catalog.snapshot.latest_month[variable.id];
  const snapshotDay = catalog.snapshot.generated_at.slice(0, 10);
  el("asof").textContent = latestMonth
    ? `資料截至 ${latestMonth.slice(0, 7)}，快照日 ${snapshotDay}`
    : `這個變數目前沒有資料，快照日 ${snapshotDay}`;
  el("source").textContent =
    `${variable.definition_zh} 來源：NASA ${variable.source_variable_id}` +
    `（doi:${variable.doi}），經 Giovanni 取得。`;

  const pts = series.points;
  const values = pts.map((p) => p.value).filter((v) => v !== null);
  if (values.length === 0) return;
  // y 軸用資料的 min 到 max（降水從 0 起算）；只有一個值或全部相同時留一點高度
  const min = Math.min(0, ...values);
  const max = Math.max(...values) > min ? Math.max(...values) : min + 1;
  const [L, R, T, B] = [48, 944, 16, 320];
  const x = (i) => (pts.length > 1 ? L + ((R - L) * i) / (pts.length - 1) : (L + R) / 2);
  const y = (v) => B - ((B - T) * (v - min)) / (max - min);
  const chart = el("chart");

  for (const frac of [0, 0.5, 1]) {
    const v = min + (max - min) * frac;
    chart.append(svg("line", { x1: L, x2: R, y1: y(v), y2: y(v), stroke: "var(--grid)" }));
    const label = svg("text", { x: L - 6, y: y(v) + 4, "text-anchor": "end", "font-size": 12, fill: "var(--muted)" });
    label.textContent = v.toFixed(2);
    chart.append(label);
  }
  pts.forEach((p, i) => {
    if (p.month.endsWith("-01-01") && Number(p.month.slice(0, 4)) % 5 === 0) {
      const label = svg("text", { x: x(i), y: B + 18, "text-anchor": "middle", "font-size": 12, fill: "var(--muted)" });
      label.textContent = p.month.slice(0, 4);
      chart.append(label);
    }
  });
  // 缺值（null）斷線，不內插
  let d = "", pen = false;
  pts.forEach((p, i) => {
    if (p.value === null) { pen = false; return; }
    d += `${pen ? "L" : "M"}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`;
    pen = true;
  });
  chart.append(svg("path", { d, fill: "none", stroke: "var(--line)", "stroke-width": 1.5 }));
  // 前後都缺值的孤立點沒有線段，補一個圓點才看得見
  pts.forEach((p, i) => {
    const alone = p.value !== null && (pts[i - 1]?.value ?? null) === null && (pts[i + 1]?.value ?? null) === null;
    if (alone) chart.append(svg("circle", { cx: x(i), cy: y(p.value), r: 2, fill: "var(--line)" }));
  });
}

main().catch((err) => {
  el("title").textContent = "讀不到資料";
  el("error").textContent = `${err}。請在 repo 根目錄執行 python3 -m http.server 8791，再開 http://localhost:8791/web/`;
});
</script>
</body>
</html>
